[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heiba-ai-analysis"
version = "0.1.0"
description = "Local forensic video analysis workstation for research and development"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python>=4.9",
  "PySide6>=6.6",
  "platformdirs>=4.2",
]

[project.optional-dependencies]
inference = ["onnxruntime>=1.17"]
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff>=0.6"]

[project.scripts]
heiba-cli = "heiba_ai.cli:main"
heiba-ai = "heiba_ai.main:main"

[tool.setuptools.packages.find]
include = ["heiba_ai*"]

[tool.pytest.ini_options]
testpaths = ["heiba_ai/tests"]
addopts = "-q"
